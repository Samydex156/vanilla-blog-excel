<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Página no encontrada (404) | Excel Learning Hub</title>
    <link rel="stylesheet" href="assets/css/main-style.css" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <style>
      .not-found {
        margin: auto;
        text-align: center;
        max-width: 480px;
        padding: 4rem 2rem;
      }
      .not-found h1 {
        font-size: 5rem;
        color: var(--accent);
        margin-bottom: 0.5rem;
      }
      .not-found h2 {
        margin-bottom: 1rem;
      }
      .not-found p {
        color: var(--text-secondary);
        margin-bottom: 2rem;
      }
      .not-found a {
        display: inline-block;
        background: var(--accent);
        color: #ffffff;
        text-decoration: none;
        padding: 0.85rem 1.75rem;
        border-radius: 8px;
        font-weight: 600;
        transition: var(--transition);
      }
      .not-found a:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main style="display: flex; width: 100%; min-height: 100vh;">
      <div class="not-found">
        <h1>404</h1>
        <h2>Página no encontrada</h2>
        <p>La página que buscas no existe o fue movida. Revisa la dirección o vuelve al inicio.</p>
        <a href="/">← Volver al inicio</a>
      </div>
    </main>
  </body>
</html>
